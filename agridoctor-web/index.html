<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123D2A">
<title>AgriDoctor AI | Smart Farm Intelligence</title>
<style>
:root{--forest:#123D2A;--leaf:#36A66B;--lime:#A7D66D;--bg:#F3F7F2;--card:#fff;--text:#17251D;--muted:#718078;--line:#E2EAE3;--bad:#B42318;--warn:#A86612;--ok:#218653;--soft:#EAF4EC;--shadow:0 12px 34px rgba(24,55,35,.07)}
[data-theme=dark]{--forest:#10291E;--leaf:#5CC889;--lime:#B5DF79;--bg:#0C1711;--card:#14231A;--text:#E8F1EA;--muted:#A0B2A5;--line:#293B30;--soft:#1B3324;--bad:#FF8585;--warn:#F2BE68;--ok:#68D69A;--shadow:0 14px 34px rgba(0,0,0,.22)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif;letter-spacing:-.012em;background:radial-gradient(ellipse at 82% 0,rgba(125,184,116,.10),transparent 34%),var(--bg);color:var(--text)}
button{font-family:inherit}
.app{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}
aside{background:linear-gradient(165deg,#153F2D,#0E3021 58%,#0A261B);color:#fff;padding:26px 16px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:21px;letter-spacing:-.045em;padding:6px 12px 4px}
.brand:before{content:"✦";display:inline-grid;place-items:center;width:29px;height:29px;margin-right:9px;border-radius:9px;color:#163C29;background:#B8E28B;font-size:17px}
.tag{color:#D3E7D8;font-size:11px;padding:0 12px 28px;line-height:1.55}
aside a{display:flex;gap:10px;align-items:center;color:#D7E9DC;text-decoration:none;padding:11px 13px;border-radius:11px;margin:3px 0;font-size:13px;font-weight:550;transition:background .18s}
aside a:hover{background:rgba(255,255,255,.10)}
aside a.on{background:rgba(183,226,139,.17);color:#D8F4B8;box-shadow:inset 3px 0 #B8E28B}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:72px;padding:13px clamp(16px,3vw,34px);background:color-mix(in srgb,var(--card) 91%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top input{flex:1 1 180px;max-width:560px;padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-size:13px}
input:focus{border-color:var(--leaf)!important;outline:0;box-shadow:0 0 0 3px rgba(54,166,107,.13)}
.btn{padding:10px 15px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:12px;font-weight:650}
.btn:hover{box-shadow:0 7px 16px rgba(20,55,32,.10)}
.btn.pri{background:linear-gradient(135deg,#1C7048,#155638);color:#fff;border-color:#1C7048}
.btn:disabled{opacity:.5}.btn.danger{color:var(--bad)}
#locList{position:absolute;top:100%;left:clamp(16px,3vw,34px);right:clamp(16px,3vw,34px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 45px rgba(0,0,0,.16);display:none;max-height:260px;overflow:auto}
#locList div{padding:12px 15px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line)}
#locList div:hover{background:var(--soft)}
#view{max-width:1440px;padding:clamp(20px,3.2vw,42px)}
section{scroll-margin-top:92px;margin-bottom:38px}
h1{font-size:clamp(26px,3vw,34px);font-weight:760;letter-spacing:-.055em;line-height:1.12;margin:0 0 8px}
h2{font-size:16px;font-weight:720;letter-spacing:-.025em;margin:0 0 13px}
h3{font-size:14px;margin:14px 0 4px}
.sub{font-size:13px;line-height:1.6;margin:0 0 22px;color:var(--muted)}
.grid{display:grid;gap:16px;margin-bottom:16px;grid-template-columns:repeat(auto-fit,minmax(225px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.grid .card{margin-bottom:0}
.stat{font-size:36px;line-height:1.15;letter-spacing:-.055em;font-weight:780;margin-top:8px;color:var(--forest)}
[data-theme=dark] .stat{color:var(--leaf)}
.muted{color:var(--muted)}.small{font-size:12px}.ok{color:var(--ok)!important}.bad{color:var(--bad)!important}.warn{color:var(--warn)}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:650;background:var(--soft)}
.bar{background:var(--soft);height:8px;border-radius:999px;overflow:hidden;margin:6px 0 10px}
.fill{background:linear-gradient(90deg,#2C9560,#9ACD68);height:8px;border-radius:999px}
.chart{display:flex;align-items:flex-end;gap:7px;height:190px;padding:12px 2px 0}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px}
.col .b{width:100%;background:linear-gradient(180deg,#83C96D,#27935C);border-radius:7px 7px 2px 2px;min-height:2px}
.col em{font-style:normal;color:var(--muted)}.col span{color:var(--muted);margin-top:3px}
.adv{border:1px solid color-mix(in srgb,var(--lime) 42%,var(--line));border-left:4px solid var(--lime);background:var(--soft);border-radius:12px;padding:13px 15px;line-height:1.55;margin-bottom:8px;font-size:14px}
.adv.hot{border-left-color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--muted);font-size:11px;text-align:left}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left}
.scroll{overflow-x:auto}
.row{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.row img{width:62px;height:62px;object-fit:cover;border-radius:12px;background:var(--soft)}.grow{flex:1;min-width:0}
#preview,.res-img{width:100%;max-height:320px;object-fit:contain;border:1px solid var(--line);border-radius:14px;background:var(--soft)}
#preview{display:none;margin:12px 0}
.libitem{display:block;width:100%;text-align:left;padding:12px 13px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:14px}
.libitem:hover{background:var(--soft)}
.kv{margin:8px 0}.kv b{display:block;font-size:13px;color:var(--muted);text-transform:capitalize}.kv ul,.card ul{margin:4px 0 0 18px;padding:0}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.55}
.search{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px}
nav.bottom{display:none}
button:focus-visible,a:focus-visible{outline:3px solid rgba(91,181,115,.55);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media(max-width:820px){
.app{grid-template-columns:1fr}aside{display:none}#view{padding:22px 15px 100px}
.top input{flex-basis:100%;max-width:none}
nav.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(16,48,33,.97);z-index:6;padding-bottom:env(safe-area-inset-bottom,0)}
nav.bottom a{flex:1;text-align:center;color:#E6F4EA;text-decoration:none;font-size:11px;padding:9px 2px;font-weight:600}
nav.bottom a span{display:block;font-size:19px}nav.bottom a.on{color:#D8F4B8;background:rgba(183,226,139,.14)}
.grid{grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px}.stat{font-size:30px}}
</style>
</head>
<body>
<div class="app">
<aside><div class="brand">AgriDoctor AI</div><div class="tag">Smart Farming. Healthier Crops. Better Tomorrow.</div><div id="sideNav"></div></aside>
<div class="main">
<div class="top">
<input type="text" id="locInput" placeholder="Search city, or type lat, lon (e.g. 28.61, 77.20)">
<button class="btn pri" id="locGo">Search</button>
<button class="btn" id="locGps">Use my location</button>
<button class="btn" id="theme">Theme</button>
<div id="locList"></div>
</div>
<div id="view"></div>
</div>
</div>
<nav class="bottom" id="botNav"></nav>

<script>
(function(){
"use strict";
var ORT_CDN="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/",ORT_BASE="ort/";
var LOW_CONF=0.5,HISTORY_MAX=60;
var NAV=[["dashboard","🏠","Dashboard"],["detect","🔬","Detect"],["weather","☀️","Weather"],["climate","📈","Climate"],["library","📚","Library"],["history","🕒","History"]];
var WX={0:"Clear",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",71:"Light snow",73:"Snow",75:"Heavy snow",80:"Rain showers",81:"Rain showers",82:"Violent showers",95:"Thunderstorm",96:"Thunderstorm, hail",99:"Thunderstorm, hail"};
var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MDAYS=[31,28.25,31,30,31,30,31,31,30,31,30,31];
var view=document.getElementById("view");

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function getJSON(url,ttl){
  var key="c:"+url,now=Date.now();
  try{var h=JSON.parse(sessionStorage.getItem(key)||"null");if(h&&now-h.t<(ttl||600000))return Promise.resolve(h);}catch(e){}
  return fetch(url).then(function(r){if(!r.ok)throw new Error("Service error "+r.status);return r.json()}).then(function(d){
    var o={t:now,d:d};try{sessionStorage.setItem(key,JSON.stringify(o))}catch(e){}return o;});
}
function fmtDate(s){try{return new Date(s).toLocaleString()}catch(e){return s}}
function pct(x){return(x*100).toFixed(1)+"%"}
function errBox(e){return"<div class='card'><p class='bad'>"+esc(e.message||e)+"</p><p class='muted small'>The rest of the app still works. Try again in a moment.</p></div>"}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v}catch(e){return d}}

/* ---------- data sources (browser calls the public APIs directly) ---------- */
function weatherData(lat,lon){
  var p=new URLSearchParams({latitude:lat.toFixed(4),longitude:lon.toFixed(4),
    current:"temperature_2m,relative_humidity_2m,precipitation,weather_code,cloud_cover,wind_speed_10m",
    hourly:"temperature_2m,relative_humidity_2m,precipitation_probability,wind_speed_10m",
    daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max",
    timezone:"auto",forecast_days:7});
  return getJSON("https://api.open-meteo.com/v1/forecast?"+p,600000).then(function(o){
    return{source:"Open-Meteo (open-meteo.com)",kind:"live forecast",fetched_at:new Date(o.t).toISOString(),data:o.d}});
}
function climateData(lat,lon,years){
  var end=new Date().getFullYear()-1,start=end-years+1;
  var p=new URLSearchParams({parameters:"T2M,PRECTOTCORR,ALLSKY_SFC_SW_DWN",community:"AG",latitude:lat.toFixed(4),longitude:lon.toFixed(4),start:start,end:end,format:"JSON"});
  return getJSON("https://power.larc.nasa.gov/api/temporal/monthly/point?"+p,86400000).then(function(o){
    var s=o.d.properties.parameter;
    function mm(n){var b=[[],[],[],[],[],[],[],[],[],[],[],[]];
      Object.keys(s[n]||{}).forEach(function(k){var m=+k.slice(4),v=s[n][k];if(m>=1&&m<=12&&typeof v==="number"&&v>-900)b[m-1].push(v)});
      return b.map(function(a){return a.length?+(a.reduce(function(x,y){return x+y},0)/a.length).toFixed(2):null})}
    var rainDay=mm("PRECTOTCORR"),rain=rainDay.map(function(v,i){return v==null?null:+(v*MDAYS[i]).toFixed(1)});
    var yearly={};
    Object.keys(s.PRECTOTCORR||{}).forEach(function(k){var y=+k.slice(0,4),m=+k.slice(4),v=s.PRECTOTCORR[k];
      if(m>=1&&m<=12&&typeof v==="number"&&v>-900)yearly[y]=(yearly[y]||0)+v*MDAYS[m-1]});
    var tot=rain.reduce(function(a,b){return a+(b||0)},0);
    return{source:"NASA POWER (power.larc.nasa.gov), AG community, monthly",fetched_at:new Date(o.t).toISOString(),years:[start,end],
      temp:mm("T2M"),rain:rain,solar:mm("ALLSKY_SFC_SW_DWN"),annual:Math.round(tot),
      byYear:Object.keys(yearly).sort().map(function(y){return{year:y,mm:Math.round(yearly[y])}})};
  });
}

/* ---------- location ---------- */
var loc=load("loc",null);
function setLoc(l){loc=l;store("loc",l);document.getElementById("locInput").value="";list.style.display="none";["dashboard","weather","climate"].forEach(renderSection)}
function needLoc(){return"<div class='card'><h2>Choose a farm location</h2><p class='muted'>Search a city above, type latitude and longitude, or tap \"Use my location\".</p></div>"}
var list=document.getElementById("locList");
document.getElementById("locGo").onclick=function(){
  var q=document.getElementById("locInput").value.trim();if(!q)return;
  var m=q.match(/^(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)$/);
  if(m){var la=+m[1],lo=+m[2];if(Math.abs(la)>90||Math.abs(lo)>180){alert("Latitude must be -90..90 and longitude -180..180.");return}
    setLoc({name:la.toFixed(3)+", "+lo.toFixed(3),lat:la,lon:lo});return}
  list.style.display="block";list.innerHTML="<div>Searching...</div>";
  getJSON("https://geocoding-api.open-meteo.com/v1/search?"+new URLSearchParams({name:q,count:6,language:"en",format:"json"}),86400000).then(function(o){
    var rs=o.d.results||[];if(!rs.length){list.innerHTML="<div>No places found.</div>";return}
    list.innerHTML="";
    rs.forEach(function(r){var d=document.createElement("div");d.textContent=[r.name,r.admin1,r.country].filter(Boolean).join(", ");
      d.onclick=function(){setLoc({name:d.textContent,lat:r.latitude,lon:r.longitude})};list.appendChild(d)});
  }).catch(function(e){list.innerHTML="<div class='bad'>"+esc(e.message)+"</div>"});
};
document.getElementById("locInput").onkeydown=function(e){if(e.key==="Enter")document.getElementById("locGo").click()};
document.getElementById("locGps").onclick=function(){
  if(!navigator.geolocation){alert("This browser has no location support.");return}
  navigator.geolocation.getCurrentPosition(function(p){setLoc({name:"My location ("+p.coords.latitude.toFixed(3)+", "+p.coords.longitude.toFixed(3)+")",lat:p.coords.latitude,lon:p.coords.longitude})},
    function(){alert("Location permission was not given. You can search a city instead.")});
};
document.addEventListener("click",function(e){if(!list.contains(e.target)&&e.target.id!=="locGo")list.style.display="none"});

/* ---------- theme ---------- */
var theme=load("theme",null)||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function applyTheme(){document.documentElement.setAttribute("data-theme",theme)}applyTheme();
document.getElementById("theme").onclick=function(){theme=theme==="dark"?"light":"dark";store("theme",theme);applyTheme()};

/* ---------- nav ---------- */
var lastNav="";
function drawNav(cur){if(cur===lastNav)return;lastNav=cur;
  function mk(n,b){return"<a href='#sec-"+n[0]+"' data-s='"+n[0]+"' class='"+(n[0]===cur?"on":"")+"'><span>"+n[1]+"</span>"+(b?"":" ")+n[2]+"</a>"}
  document.getElementById("sideNav").innerHTML=NAV.map(function(n){return mk(n,0)}).join("");
  document.getElementById("botNav").innerHTML=NAV.map(function(n){return mk(n,1)}).join("")}

/* ---------- charts ---------- */
function bars(vals,labels,unit){
  var nums=vals.filter(function(v){return v!=null});if(!nums.length)return"<p class='muted'>No data.</p>";
  var hi=Math.max.apply(null,nums.concat([1]));
  return"<div class='chart'>"+vals.map(function(v,i){return"<div class='col' title='"+esc(labels[i]+": "+v)+"'><em>"+v+"</em><div class='b' style='height:"+Math.max(3,v/hi*100)+"%'></div><span>"+esc(labels[i])+"</span></div>"}).join("")+"</div><p class='muted small'>"+esc(unit)+"</p>";
}
function lineChart(vals,labels,unit){
  var ok=vals.map(function(v,i){return v==null||!isFinite(+v)?null:{v:+v,i:i}}).filter(Boolean);
  if(!ok.length)return"<p class='muted'>No data returned by the data provider.</p>";
  var mn=Math.min.apply(null,ok.map(function(x){return x.v})),mxv=Math.max.apply(null,ok.map(function(x){return x.v})),sp=mxv-mn||1;
  var W=720,H=190,L=34,R=12,T=18,B=30,pw=W-L-R,ph=H-T-B,n=vals.length;
  var pts=ok.map(function(x){return{x:L+(n===1?pw/2:x.i/(n-1)*pw),y:T+(mxv-x.v)/sp*ph,v:x.v,i:x.i}});
  var poly=pts.map(function(p){return p.x.toFixed(1)+","+p.y.toFixed(1)}).join(" ");
  var grid=[0,1,2,3].map(function(k){var y=T+k*ph/3;return"<line x1='"+L+"' y1='"+y+"' x2='"+(L+pw)+"' y2='"+y+"' stroke='var(--line)' stroke-dasharray='3 5'/><text x='3' y='"+(y+4)+"' fill='var(--muted)' font-size='10'>"+(mxv-k*sp/3).toFixed(1)+"</text>"}).join("");
  var step=Math.max(1,Math.ceil(labels.length/8));
  var ticks=labels.map(function(l,i){if(i%step&&i!==labels.length-1)return"";return"<text x='"+(L+(n===1?pw/2:i/(n-1)*pw))+"' y='"+(H-7)+"' text-anchor='middle' fill='var(--muted)' font-size='10'>"+esc(l)+"</text>"}).join("");
  var dots=pts.map(function(p){return"<circle cx='"+p.x+"' cy='"+p.y+"' r='3.2' fill='var(--leaf)'><title>"+esc(labels[p.i]+": "+p.v.toFixed(1)+" "+unit)+"</title></circle>"}).join("");
  return"<div style='overflow-x:auto'><svg viewBox='0 0 "+W+" "+H+"' role='img' aria-label='"+esc(unit)+" chart' style='width:100%;min-width:320px;height:auto'>"+grid+
    "<polygon points='"+L+","+(T+ph)+" "+poly+" "+(L+pw)+","+(T+ph)+"' fill='var(--leaf)' opacity='.10'/><polyline points='"+poly+"' fill='none' stroke='var(--leaf)' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>"+dots+ticks+"</svg></div><p class='muted small'>"+esc(unit)+"</p>";
}

/* ---------- weather helpers + advisories ---------- */
function nextHours(w,n){var cur=w.current.time.slice(0,13)+":00",t=w.hourly.time,i=0;while(i<t.length&&t[i]<cur)i++;return{from:i,to:Math.min(t.length,i+n)}}
function avg(a){var s=0,c=0;a.forEach(function(v){if(v!=null){s+=v;c++}});return c?s/c:null}
function maxOf(a){var m=null;a.forEach(function(v){if(v!=null&&(m==null||v>m))m=v});return m}
function advisories(w){
  var out=[],r=nextHours(w,24),h=w.hourly,d=w.daily;
  var rh=avg(h.relative_humidity_2m.slice(r.from,r.to)),t=avg(h.temperature_2m.slice(r.from,r.to)),pp=maxOf(h.precipitation_probability.slice(r.from,r.to));
  if(rh!=null&&t!=null&&rh>=80&&t>=15&&t<=30)out.push(["Warm, humid weather ahead (about "+rh.toFixed(0)+"% humidity). Conditions like this can favour fungal diseases; inspect leaves regularly.",0]);
  if((pp!=null&&pp>=60)||(d.precipitation_sum[0]!=null&&d.precipitation_sum[0]>=10))out.push(["Rain is likely in the next 24 hours (up to "+(pp==null?"?":pp)+"% chance). Consider postponing irrigation and spraying.",0]);
  if(d.temperature_2m_max[0]!=null&&d.temperature_2m_max[0]>=38)out.push(["High temperature today ("+d.temperature_2m_max[0]+" °C). Watch for heat stress and check irrigation needs.",1]);
  if(d.temperature_2m_min[0]!=null&&d.temperature_2m_min[0]<=2)out.push(["Low temperature today ("+d.temperature_2m_min[0]+" °C). Frost risk for sensitive crops.",1]);
  if(w.current.wind_speed_10m>=30)out.push(["Strong wind now ("+w.current.wind_speed_10m+" km/h). Avoid spraying until it calms down.",1]);
  if(d.precipitation_sum.reduce(function(a,b){return a+(b||0)},0)<1)out.push(["Almost no rain in the 7-day forecast. Check soil moisture and plan irrigation.",0]);
  if(!out.length)out.push(["No weather warnings from the current forecast.",0]);
  return out;
}
function advHtml(w){return advisories(w).map(function(a){return"<div class='adv"+(a[1]?" hot":"")+"'>"+esc(a[0])+"</div>"}).join("")}
function srcLine(res){return"<p class='note'>Source: "+esc(res.source)+" · "+esc(res.kind)+" · data time "+esc(res.data.current?res.data.current.time:"-")+" · fetched "+esc(fmtDate(res.fetched_at))+"</p>"}
function weatherCard(res){var w=res.data,c=w.current,u=w.current_units||{};
  return"<div class='card'><h2>Weather now</h2><div class='stat'>"+c.temperature_2m+" "+esc(u.temperature_2m||"°C")+"</div><p>"+esc(WX[c.weather_code]||"Unknown")+"</p><p class='muted'>Humidity "+c.relative_humidity_2m+"% · Rain "+c.precipitation+" mm · Wind "+c.wind_speed_10m+" km/h · Cloud "+c.cloud_cover+"%</p>"+srcLine(res)+"</div>"}

/* ---------- farmer advice (same rules as the Python app) ---------- */
function splitLabel(l){var p=l.replace("___","_").split("_"),c=p[0].charAt(0).toUpperCase()+p[0].slice(1).toLowerCase();return[c,p.slice(1).join(" ").trim()]}
function pretty(l){var s=splitLabel(l);return s[1]?s[0]+" - "+s[1]:s[0]}
function farmerAdvice(label,wx){
  var text=label.toLowerCase().replace(/_/g," "),sp=splitLabel(label),healthy=text.indexOf("healthy")>=0,causes,actions;
  function has(a){return a.some(function(x){return text.indexOf(x)>=0})}
  if(healthy){causes=["No disease was identified by the model."];actions=["Continue regular crop monitoring.","Maintain balanced irrigation and nutrition.","Inspect new leaves regularly for changes."]}
  else if(has(["late blight","early blight","leaf spot","mildew","rust","fungal"])){causes=["The predicted condition may be associated with fungal infection.","Wet leaves and humid conditions can encourage some fungal diseases."];actions=["Remove severely affected leaves where practical.","Avoid overhead irrigation and improve airflow around plants.","Avoid working among wet plants.","Confirm the diagnosis with a local agricultural expert before treatment."]}
  else if(has(["bacterial"])){causes=["The predicted condition may be associated with bacterial infection.","Splashing water and contaminated tools can spread some bacterial diseases."];actions=["Remove badly affected plant material where practical.","Clean tools between plants.","Avoid overhead watering.","Seek local agricultural advice before applying any treatment."]}
  else if(has(["mosaic","virus","viral"])){causes=["The predicted condition may be associated with a plant virus.","Some plant viruses are spread by insect vectors or infected planting material."];actions=["Separate suspected infected plants where practical.","Check plants for aphids, whiteflies and other insect vectors.","Use healthy planting material.","Ask a local agricultural expert to confirm the diagnosis."]}
  else{causes=["The AI model has identified a possible plant health problem.","A photograph alone cannot confirm the exact cause."];actions=["Inspect the whole plant, including the underside of leaves.","Check watering, drainage and recent fertilizer use.","Remove severely affected material where practical.","Get confirmation from a local agricultural expert."]}
  var wf=[];
  if(wx&&wx.current){var c=wx.current;
    if(c.relative_humidity_2m>=80)wf.push("High humidity ("+c.relative_humidity_2m+"%). This may favour some fungal diseases.");
    if(c.temperature_2m>=35)wf.push("High temperature ("+c.temperature_2m+" °C). Monitor plants for heat stress.");
    if(c.precipitation>=2)wf.push("Current precipitation is "+c.precipitation+" mm. Check drainage and avoid unnecessary irrigation.");
    if(c.wind_speed_10m>=30)wf.push("Wind speed is "+c.wind_speed_10m+" km/h. Avoid spraying in strong wind.")}
  if(!wf.length)wf.push("No significant weather warning was identified from the available current weather data.");
  return{crop:sp[0],disease:sp[1]||"Healthy",causes:causes,actions:actions,weather_factors:wf,
    next_steps:["Check several leaves and more than one plant.","Compare symptoms with a trusted crop disease guide.","Recheck the crop over the next 2–3 days.","Confirm treatment and pesticide use with your local agriculture extension office."],
    sources:[{name:"TNAU Agritech Portal",url:"https://agritech.tnau.ac.in/"},{name:"ICAR",url:"https://icar.org.in/"}]};
}

/* ---------- model + knowledge base (files sit next to index.html) ---------- */
var M={labels:null,kb:{},session:null,loading:null};
function ensureLabels(){
  if(M.labels)return Promise.resolve();
  return fetch("labels.json").then(function(r){if(!r.ok)throw new Error("labels.json not found");return r.json()}).then(function(j){
    M.labels=Array.isArray(j)?j:(j.labels||j.classes||Object.keys(j).sort(function(a,b){return j[a]-j[b]}));
  }).then(function(){return fetch("kb.json").then(function(r){return r.ok?r.json():null}).catch(function(){return null})}).then(function(d){
    if(!d)return;if(d.diseases)d=d.diseases;
    if(Array.isArray(d))d.forEach(function(v){var k=v&&(v.label||v.class||v.key||v.id||v.name);if(k)M.kb[String(k).toLowerCase()]=v});
    else Object.keys(d).forEach(function(k){if(d[k]&&typeof d[k]==="object")M.kb[k.toLowerCase()]=d[k]});
  });
}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement("script");s.src=src;s.onload=res;s.onerror=function(){rej(new Error("Could not load "+src))};document.head.appendChild(s)})}
function ensureModel(){
  if(M.session)return Promise.resolve();
  if(M.loading)return M.loading;
  M.loading=ensureLabels().then(function(){
    return window.ort?0:loadScript("ort/ort.min.js").catch(function(){ORT_BASE=ORT_CDN;return loadScript(ORT_CDN+"ort.min.js")});
  }).then(function(){
    ort.env.wasm.numThreads=1;ort.env.wasm.wasmPaths=ORT_BASE;
    return ort.InferenceSession.create("model.onnx",{executionProviders:["wasm"]});
  }).then(function(s){M.session=s}).catch(function(e){M.loading=null;throw new Error("Model could not be loaded: "+e.message+". Check that model.onnx and labels.json are in the same folder as index.html.")});
  return M.loading;
}
function runModel(img){
  var S=224,cv=document.createElement("canvas");cv.width=cv.height=S;
  var cx=cv.getContext("2d");cx.drawImage(img,0,0,S,S);
  var px=cx.getImageData(0,0,S,S).data,f=new Float32Array(3*S*S),mean=[.485,.456,.406],std=[.229,.224,.225];
  for(var i=0;i<S*S;i++)for(var c=0;c<3;c++)f[c*S*S+i]=(px[i*4+c]/255-mean[c])/std[c];
  var name=M.session.inputNames[0],feeds={};feeds[name]=new ort.Tensor("float32",f,[1,3,S,S]);
  return M.session.run(feeds).then(function(out){
    var lg=out[M.session.outputNames[0]].data,mx=-Infinity,i;
    for(i=0;i<lg.length;i++)if(lg[i]>mx)mx=lg[i];
    var ex=Array.prototype.map.call(lg,function(v){return Math.exp(v-mx)}),sum=ex.reduce(function(a,b){return a+b},0);
    return ex.map(function(v,i){return{label:M.labels[i],name:pretty(M.labels[i]),confidence:v/sum}})
      .sort(function(a,b){return b.confidence-a.confidence}).slice(0,3);
  });
}
function thumb(img){var c=document.createElement("canvas"),k=Math.min(1,160/Math.max(img.naturalWidth,img.naturalHeight));
  c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.7)}

function infoHtml(info){
  var skip={label:1,"class":1,key:1,id:1,name:1},h="";
  Object.keys(info).forEach(function(k){if(skip[k])return;var v=info[k];if(v==null||v===""||(Array.isArray(v)&&!v.length))return;
    h+="<div class='kv'><b>"+esc(k.replace(/_/g," "))+"</b>";
    if(Array.isArray(v))h+="<ul>"+v.map(function(x){return"<li>"+esc(typeof x==="object"?JSON.stringify(x):x)+"</li>"}).join("")+"</ul>";
    else h+="<div>"+esc(typeof v==="object"?JSON.stringify(v):v)+"</div>";h+="</div>"});
  return h+"<p class='note'>For pesticides and doses, follow your local agriculture extension office or the product label.</p>";
}

/* ---------- history (stored in this browser) ---------- */
function history(){return load("history",[])}
function addHistory(r){var h=history();h.unshift(r);store("history",h.slice(0,HISTORY_MAX))}

/* ---------- pages ---------- */
function pageDashboard(){
  var hr=new Date().getHours(),g=hr<12?"Good morning":hr<18?"Good afternoon":"Good evening",h=history();
  var healthy=h.filter(function(r){return r.healthy}).length,by={};
  h.forEach(function(r){if(!r.healthy)by[r.name]=(by[r.name]||0)+1});
  var top=Object.keys(by).map(function(k){return[k,by[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,8);
  var days=[],cnt={};for(var i=13;i>=0;i--){days.push(new Date(Date.now()-i*864e5).toISOString().slice(0,10))}
  h.forEach(function(r){var d=r.created.slice(0,10);cnt[d]=(cnt[d]||0)+1});
  view.innerHTML="<h1>"+g+"</h1><p class='sub'>"+(loc?"Farm location: "+esc(loc.name):"No farm location chosen yet")+" · "+new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"})+"</p>"+
    "<div class='grid'><div class='card'><div class='muted'>Total detections</div><div class='stat'>"+h.length+"</div></div><div class='card'><div class='muted'>Healthy plants</div><div class='stat ok'>"+healthy+"</div></div><div class='card'><div class='muted'>Diseased plants</div><div class='stat bad'>"+(h.length-healthy)+"</div></div></div><div id='wx'></div>"+
    "<div class='card'><h2>Detections, last 14 days</h2>"+bars(days.map(function(d){return cnt[d]||0}),days.map(function(d){return d.slice(8)}),"photos checked per day")+"</div>"+
    (top.length?"<div class='card'><h2>Most detected diseases</h2>"+top.map(function(d){return"<div>"+esc(d[0])+" <span class='muted'>("+d[1]+")</span><div class='bar'><div class='fill' style='width:"+d[1]/top[0][1]*100+"%'></div></div></div>"}).join("")+"</div>":"");
  var box=view.querySelector("#wx");
  if(!loc){box.innerHTML=needLoc();return}
  box.innerHTML="<div class='card muted'>Loading weather...</div>";
  weatherData(loc.lat,loc.lon).then(function(res){
    box.innerHTML=weatherCard(res)+"<div class='card'><h2>Farming advisories</h2>"+advHtml(res.data)+"<p class='note'>Suggestions from the forecast only. They are not a diagnosis.</p></div>";
  }).catch(function(e){box.innerHTML=errBox(e)});
}

function pageDetect(){
  var sec=view;
  view.innerHTML="<h1>Plant disease detection</h1><p class='sub'>One leaf, close up, in good light. The photo is analysed on this device and is not uploaded.</p><div class='card'>"+
    "<input type='file' id='cam' accept='image/*' capture='environment' style='display:none'><input type='file' id='pick' accept='image/*' style='display:none'>"+
    "<button class='btn' id='camBtn'>Take a photo</button> <button class='btn' id='pickBtn'>Choose a photo</button><img id='preview' alt='Your photo'>"+
    "<p><button class='btn pri' id='go' disabled>Find the disease</button></p></div><div id='result'></div>";
  var file=null,prev=sec.querySelector("#preview"),go=sec.querySelector("#go"),box=sec.querySelector("#result");
  function chosen(f){if(!f)return;file=f;prev.src=URL.createObjectURL(f);prev.style.display="block";go.disabled=false;box.innerHTML=""}
  sec.querySelector("#camBtn").onclick=function(){sec.querySelector("#cam").click()};
  sec.querySelector("#pickBtn").onclick=function(){sec.querySelector("#pick").click()};
  sec.querySelector("#cam").onchange=function(){chosen(this.files[0])};
  sec.querySelector("#pick").onchange=function(){chosen(this.files[0])};
  go.onclick=function(){
    if(!file)return;go.disabled=true;go.textContent="Checking...";box.innerHTML="<div class='card muted'>Loading the model (first run downloads it)...</div>";
    var img=new Image(),res,adv;
    img.onload=function(){
      ensureModel().then(function(){return runModel(img)}).then(function(r){
        res=r;var top=r[0],healthy=top.label.toLowerCase().indexOf("healthy")>=0,low=top.confidence<LOW_CONF,p=top.confidence*100;
        var h="<div class='card'><h2>Result</h2><img class='res-img' src='"+esc(prev.src)+"' alt='Uploaded leaf'><p style='font-size:22px;font-weight:700;margin:10px 0 2px' class='"+(healthy?"ok":"bad")+"'>"+esc(top.name)+"</p>"+
          "<p class='"+(healthy?"ok":"bad")+"'>"+(healthy?"The plant looks healthy.":"Disease found.")+"</p><p>"+p.toFixed(1)+"% confidence</p><div class='bar'><div class='fill' style='width:"+p+"%'></div></div>";
        if(low)h+="<p class='warn'>The model is not sure. Take a clearer photo: one leaf, good light, close up. Treat this result as uncertain.</p>";
        h+="<p class='muted small'>Other possibilities</p>"+r.slice(1).map(function(o){return"<div>"+pct(o.confidence)+" &nbsp; "+esc(o.name)+"</div>"}).join("")+
          "<p class='note'>This is an AI estimate from one photo, not a lab diagnosis. Saved to History.</p></div>";
        box.innerHTML=h;
        addHistory({created:new Date().toISOString(),label:top.label,name:top.name,confidence:top.confidence,healthy:healthy,low:low,place:loc?loc.name:"",img:thumb(img)});
        renderSection("history");renderSection("dashboard");
        var info=M.kb[top.label.toLowerCase()];
        if(info)box.innerHTML+="<div class='card'><h2>About this condition</h2>"+infoHtml(info)+"</div>";
        return(loc?weatherData(loc.lat,loc.lon).then(function(w){return w.data}).catch(function(){return null}):Promise.resolve(null));
      }).then(function(wx){
        if(!res)return;var a=farmerAdvice(res[0].label,wx);
        function li(x){return"<li>"+esc(x)+"</li>"}
        box.innerHTML+="<div class='card'><h2>Farmer Action Plan</h2><p><b>Crop:</b> "+esc(a.crop)+"</p><p><b>Detected condition:</b> "+esc(a.disease)+"</p>"+
          "<h3>Possible causes</h3><ul>"+a.causes.map(li).join("")+"</ul><h3>Recommended actions</h3><ul>"+a.actions.map(li).join("")+"</ul>"+
          "<h3>Weather factors</h3>"+a.weather_factors.map(function(x){return"<div class='adv'>"+esc(x)+"</div>"}).join("")+
          "<h3>Next steps</h3><ul>"+a.next_steps.map(li).join("")+"</ul><h3>Useful resources</h3><ul>"+a.sources.map(function(s){return"<li><a href='"+esc(s.url)+"' target='_blank' rel='noopener noreferrer'>"+esc(s.name)+"</a></li>"}).join("")+"</ul>"+
          "<p class='note'>General guidance. Confirm the diagnosis locally before applying treatments.</p></div>";
      }).catch(function(e){box.innerHTML=errBox(e)}).then(function(){go.disabled=false;go.textContent="Find the disease"});
    };
    img.onerror=function(){box.innerHTML=errBox("This file is not a readable photo.");go.disabled=false;go.textContent="Find the disease"};
    img.src=prev.src;
  };
}

function pageWeather(){
  view.innerHTML="<h1>Weather</h1><p class='sub'>"+(loc?esc(loc.name):"")+" · Live conditions and the next seven days</p><div id='w'></div>";
  var box=view.querySelector("#w");
  if(!loc){box.innerHTML="<div class='card muted'>Choose a farm location at the top to see the forecast.</div>";return}
  box.innerHTML="<div class='card muted'>Fetching live weather from Open-Meteo...</div>";
  weatherData(loc.lat,loc.lon).then(function(res){
    var w=res.data,c=w.current,h=w.hourly,d=w.daily,r=nextHours(w,24);
    var lab=h.time.slice(r.from,r.to).map(function(t){return new Date(t).toLocaleTimeString([],{hour:"numeric"})});
    function metric(l,v,u,hint){return"<div class='card'><div class='muted'>"+l+"</div><div class='stat'>"+(v==null?"—":esc(v))+"<span style='font-size:15px;font-weight:600'> "+u+"</span></div><p class='muted small'>"+hint+"</p></div>"}
    function sl(a){return a.slice(r.from,r.to)}
    var dl=d.time.map(function(x){return new Date(x).toLocaleDateString(undefined,{weekday:"short"})});
    var rows=d.time.map(function(day,i){return"<tr><td>"+esc(new Date(day).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}))+"</td><td>"+esc(WX[d.weather_code[i]]||"-")+"</td><td>"+d.temperature_2m_min[i]+" / "+d.temperature_2m_max[i]+"</td><td>"+d.precipitation_sum[i]+"</td><td>"+(d.precipitation_probability_max[i]==null?"-":d.precipitation_probability_max[i]+"%")+"</td><td>"+d.wind_speed_10m_max[i]+"</td></tr>"}).join("");
    box.innerHTML="<div class='grid'>"+metric("Temperature",c.temperature_2m,"°C",esc(WX[c.weather_code]||"Current weather"))+metric("Humidity",c.relative_humidity_2m,"%","Relative humidity")+metric("Rainfall now",c.precipitation,"mm","Current precipitation")+metric("Wind",c.wind_speed_10m,"km/h","Wind at 10 metres")+"</div>"+
      "<div class='card'><h2>Temperature · next 24 hours</h2>"+lineChart(sl(h.temperature_2m),lab,"°C")+"</div>"+
      "<div class='card'><h2>Humidity · next 24 hours</h2>"+lineChart(sl(h.relative_humidity_2m),lab,"% relative humidity")+"</div>"+
      "<div class='card'><h2>Rain chance · next 24 hours</h2>"+lineChart(sl(h.precipitation_probability),lab,"% probability")+"</div>"+
      "<div class='card'><h2>Wind · next 24 hours</h2>"+lineChart(sl(h.wind_speed_10m),lab,"km/h")+"</div>"+
      "<div class='card'><h2>7-day temperature outlook</h2>"+lineChart(d.temperature_2m_max,dl,"°C maximum")+lineChart(d.temperature_2m_min,dl,"°C minimum")+"</div>"+
      "<div class='card'><h2>7-day forecast</h2><div class='scroll'><table><tr><th>Day</th><th>Sky</th><th>Min / Max (°C)</th><th>Rain (mm)</th><th>Rain chance</th><th>Max wind (km/h)</th></tr>"+rows+"</table></div>"+srcLine(res)+"</div>"+
      "<div class='card'><h2>Farm weather advisories</h2>"+advHtml(w)+"</div>";
  }).catch(function(e){box.innerHTML=errBox(e)});
}

function pageClimate(){
  view.innerHTML="<h1>Climate history</h1><p class='sub'>"+(loc?esc(loc.name):"Choose a farm location to load local historical climate")+"</p><div id='c'></div>";
  var box=view.querySelector("#c");
  if(!loc){box.innerHTML="<div class='card muted'>Choose a farm location at the top to see climate history.</div>";return}
  box.innerHTML="<div class='card muted'>Loading historical climate from NASA POWER...</div>";
  climateData(loc.lat,loc.lon,10).then(function(c){
    box.innerHTML="<div class='card'><p class='muted'>Historical monthly averages · "+c.years[0]+"–"+c.years[1]+" · not a forecast</p><div class='stat'>"+c.annual+" mm</div><p class='muted'>Average annual rainfall across available monthly records</p><p class='note'>NASA POWER gives gridded, model-derived estimates, not farm station readings.</p></div>"+
      "<div class='card'><h2>Mean temperature by month</h2>"+lineChart(c.temp,MONTHS,"°C (mean air temperature at 2 m)")+"</div>"+
      "<div class='card'><h2>Rainfall by month</h2>"+lineChart(c.rain,MONTHS,"mm per month")+"</div>"+
      "<div class='card'><h2>Solar radiation by month</h2>"+lineChart(c.solar,MONTHS,"kWh/m²/day")+"</div>"+
      "<div class='card'><h2>Rainfall each year</h2>"+lineChart(c.byYear.map(function(y){return y.mm}),c.byYear.map(function(y){return y.year}),"mm per year")+"</div>"+
      "<div class='card'><p class='note'>Source: "+esc(c.source)+" · retrieved "+esc(fmtDate(c.fetched_at))+".</p></div>";
  }).catch(function(e){box.innerHTML=errBox(e)});
}

function pageLibrary(){
  view.innerHTML="<h1>Disease library</h1><p class='sub'>Everything the model can recognise.</p><div class='card'><input class='search' type='text' id='q' placeholder='Search crop or disease'></div><div id='libInfo'></div><div id='lib'></div>";
  var lib=view.querySelector("#lib"),info=view.querySelector("#libInfo"),q=view.querySelector("#q");
  ensureLabels().then(function(){
    function draw(){
      var s=q.value.toLowerCase().trim(),g={};
      M.labels.forEach(function(l){if(!s||l.toLowerCase().indexOf(s)>=0){var p=splitLabel(l);(g[p[0]]=g[p[0]]||[]).push({label:l,d:p[1]||"-"})}});
      var ks=Object.keys(g).sort();
      lib.innerHTML=ks.length?ks.map(function(k){return"<div class='card'><h2>"+esc(k)+" <span class='pill'>"+g[k].length+"</span></h2>"+g[k].map(function(c){
        return"<button class='libitem' data-l='"+esc(c.label)+"'>"+esc(c.d)+(c.label.toLowerCase().indexOf("healthy")>=0?" <span class='pill ok'>healthy</span>":"")+(M.kb[c.label.toLowerCase()]?"":" <span class='muted small'>(no guidance saved)</span>")+"</button>"}).join("")+"</div>"}).join(""):"<div class='card muted'>Nothing matches.</div>";
      Array.prototype.forEach.call(lib.querySelectorAll(".libitem"),function(b){b.onclick=function(){
        var l=b.getAttribute("data-l"),e=M.kb[l.toLowerCase()];
        info.innerHTML="<div class='card'><h2>"+esc(l.replace(/_+/g," "))+"</h2>"+(e?infoHtml(e):"<p class='muted'>No guidance saved for this class. Add it to kb.json.</p>")+"</div>";info.scrollIntoView({behavior:"smooth"})}});
    }
    q.oninput=draw;draw();
  }).catch(function(e){lib.innerHTML=errBox(e)});
}

function pageHistory(){
  view.innerHTML="<h1>Detection history</h1><p class='sub'>Saved in this browser only</p><div id='h'></div>";
  var box=view.querySelector("#h");
  var h=history();
  if(!h.length){box.innerHTML="<div class='card muted'>No detections yet. Try the Detect section.</div>";return}
  box.innerHTML="<div class='card'>"+h.map(function(r,i){return"<div class='row'>"+(r.img?"<img src='"+r.img+"' alt=''>":"<img alt=''>")+"<div class='grow'><b class='"+(r.healthy?"ok":"bad")+"'>"+esc(r.name)+"</b> <span class='pill'>"+pct(r.confidence)+"</span>"+(r.low?" <span class='warn small'>uncertain</span>":"")+"<div class='muted small'>"+esc(fmtDate(r.created))+(r.place?" · "+esc(r.place):"")+"</div></div><button class='btn danger' data-i='"+i+"'>Delete</button></div>"}).join("")+"</div>";
  Array.prototype.forEach.call(box.querySelectorAll("button[data-i]"),function(b){b.onclick=function(){
    if(!confirm("Delete this detection?"))return;var a=history();a.splice(+b.getAttribute("data-i"),1);store("history",a);renderSection("history");renderSection("dashboard")}});
}

var PAGES={dashboard:pageDashboard,detect:pageDetect,weather:pageWeather,climate:pageClimate,library:pageLibrary,history:pageHistory};
var SECTIONS=NAV.map(function(n){return n[0]});
function renderSection(n){view=document.getElementById("sec-"+n);PAGES[n]()}
function setActive(){var cur=SECTIONS[0];SECTIONS.forEach(function(n){var el=document.getElementById("sec-"+n);if(el&&el.getBoundingClientRect().top<=130)cur=n});drawNav(cur)}
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[data-s]");if(!a)return;e.preventDefault();document.getElementById("sec-"+a.getAttribute("data-s")).scrollIntoView({behavior:"smooth",block:"start"})});
window.addEventListener("scroll",setActive);
var main=document.getElementById("view");
main.innerHTML=SECTIONS.map(function(n){return"<section id='sec-"+n+"'></section>"}).join("");
SECTIONS.forEach(renderSection);drawNav(SECTIONS[0]);
})();
</script>
